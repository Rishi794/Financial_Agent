name: Autonomous Research Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: autonomous-research-agent
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 135

    env:
      PYTHONUNBUFFERED: "1"
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache model and runtime
        uses: actions/cache@v4
        with:
          path: |
            models
            runtime
          key: agent-qwen35-4b-gguf-r4-${{ runner.os }}-${{ hashFiles('config/agent.json', '.github/workflows/agent.yml', 'scripts/setup_runtime.sh') }}

      - name: Prepare model + runtime
        run: ./scripts/setup_runtime.sh

      - name: Start local model server
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/runtime:${LD_LIBRARY_PATH:-}"

          echo "=== llama-server dependencies ==="
          ldd ./runtime/llama-server

          if ldd ./runtime/llama-server | grep -q "not found"; then
            echo "ERROR: unresolved shared libraries"
            exit 1
          fi

          ./runtime/llama-server \
            -m models/Qwen3.5-4B-Q4_K_M.gguf \
            --host 127.0.0.1 \
            --port 8080 \
            --ctx-size 16384 \
            --threads 4 \
            --batch-size 256 \
            --ubatch-size 128 \
            --n-predict 4096 \
            --reasoning on \
            --reasoning-budget 2048 \
            > /tmp/llama.log 2>&1 &

          echo $! > /tmp/llama.pid

          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "llama-server is healthy"
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/llama.pid)" 2>/dev/null; then
              echo "llama-server exited prematurely"
              cat /tmp/llama.log
              exit 1
            fi

            sleep 2
          done

          cat /tmp/llama.log
          exit 1

      - name: Run agent
        run: python3 -m agent.main

      - name: Persist memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory workspace

          if git diff --cached --quiet; then
            echo "No memory/workspace changes."
            exit 0
          fi

          git commit -m "agent: persist research run"

          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" &&
            git push origin "HEAD:${GITHUB_REF_NAME}" &&
            exit 0

            git rebase --abort || true
            sleep $((i * 3))
          done

          exit 1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-diagnostics-${{ github.run_id }}
          path: |
            /tmp/llama.log
            /tmp/llama.pid
          retention-days: 14
          if-no-files-found: ignore
