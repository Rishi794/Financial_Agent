name: Saturday Research Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 6"

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: .
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Send Saturday digest
        run: python3 tools/send_email.py
